name: snowflake-migration-demo

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'

  workflow_dispatch:

jobs:
  deploy-snowflake-changes-job:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 3. Install schemachange
      - name: Install schemachange
        run: |
          echo "Installing schemachange..."
          python -m pip install --upgrade pip
          python -m pip install schemachange==4.3.3
          python -m pip show schemachange

      # 4. Verify Snowflake connection
      - name: Verify Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SF_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE }}

        run: |
          echo "========================================"
          echo "Testing Snowflake connection"
          echo "========================================"

          schemachange verify -L DEBUG

          echo "========================================"
          echo "Snowflake connection test completed"
          echo "========================================"

      # 5. Deploy Snowflake changes
      - name: Deploy Snowflake changes
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SF_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SF_DATABASE }}

        run: |
          echo "========================================"
          echo "Starting Snowflake deployment"
          echo "========================================"

          schemachange deploy \
            -f "$GITHUB_WORKSPACE/deploy" \
            -c "$SNOWFLAKE_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table \
            -L DEBUG

          echo "========================================"
          echo "Snowflake deployment completed"
          echo "========================================"
